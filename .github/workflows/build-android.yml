name: Build Android APK and AAB (TWA)

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
      - '*.js'
      - 'index.html'
      - 'privacy.html'
      - 'styles.css'
      - 'icons/**'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
      - '*.js'
      - 'index.html'
      - 'privacy.html'
      - 'styles.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # Release builds MUST be signed with the same upload key every time, or Google Play
      # rejects the update. Store the keystore once as a base64 secret:
      #   base64 -w0 release.keystore  ->  secrets.ANDROID_KEYSTORE_BASE64
      # Without that secret this job only builds the debug APK (no throwaway release key).
      - name: Restore Release Signing Keystore
        id: keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > release.keystore
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - building debug APK only. Release APK/AAB need a stable upload key."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Build Signed Release APK & Bundle (AAB)
        if: steps.keystore.outputs.available == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease bundleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
            --stacktrace

      - name: Collect Output Binaries
        run: |
          mkdir -p android-dist
          echo "Scanning for built APK and AAB files across workspace..."
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp -v {} android-dist/ \;
          echo "Collected Binaries:"
          ls -lh android-dist/
          if [ -z "$(ls -A android-dist/*.apk 2>/dev/null)" ]; then
            echo "❌ Error: No APK files found in android-dist!"
            exit 1
          fi

      - name: Upload Android Build Artifacts (APK, AAB)
        uses: actions/upload-artifact@v4
        with:
          name: lyricwave-android-build
          path: android-dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twa-latest
          name: "LyricWave Standalone Android App & Play Store Bundle (Latest)"
          body: |
            ## 🎵 LyricWave Standalone Android Native App

            - **App Type:** Standalone Native App (Bundled Offline Assets, 0ms Launch, No URL Bar)
            - **Target Compatibility:** Android 5.0 (API 21) up to Android 14, 15, 16, 17 (API 34+)
            - **Package Name:** `app.lyricwave.twa`

            ### 📦 Downloadable Files
            - `app-debug.apk`: Ready to sideload and install immediately on any Android phone.
            - `app-release.apk`: Signed release APK.
            - `app-release.aab`: Production Android App Bundle for Google Play Store Console submission.
          files: |
            android-dist/*.apk
            android-dist/*.aab
