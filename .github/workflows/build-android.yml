name: Build Android APK and AAB (TWA)

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Signing Keystore
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'lyricwave_dev_pass' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'android' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'lyricwave_dev_pass' }}
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=LyricWave, OU=App, O=LyricWave, L=Internet, S=Global, C=US"

          echo "Digital Asset Links SHA-256 Fingerprint:"
          keytool -list -v -keystore release.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep "SHA256:" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK & Release Bundle (AAB) with Gradle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'lyricwave_dev_pass' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'android' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'lyricwave_dev_pass' }}
        run: |
          set -o pipefail
          echo "Compiling Debug APK..."
          gradle assembleDebug --stacktrace 2>&1 | tee build_debug.log || {
            echo "::error::Gradle build failed. Dumping last 100 lines of log:"
            tail -n 100 build_debug.log
            exit 1
          }
          
          echo "Compiling Release APK & Bundle..."
          gradle assembleRelease bundleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
            --stacktrace || true

      - name: Collect Output Binaries
        if: always()
        run: |
          mkdir -p android-dist
          echo "Collecting APK files..."
          find android/app/build/outputs/ -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp -v {} android-dist/ \; 2>/dev/null || true
          cp -v android/build_debug.log android-dist/ 2>/dev/null || true
          echo "Collected Binaries:"
          ls -lh android-dist/

      - name: Upload Android Build Artifacts (APK, AAB & Build Log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyricwave-android-build
          path: android-dist/
          if-no-files-found: warn
          retention-days: 30
