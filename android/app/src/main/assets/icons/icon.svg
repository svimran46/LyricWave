<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760"/>
      <stop offset="100%" stop-color="#1db954"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#1db954" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Soundwave Bars -->
  <g filter="url(#glow)" fill="url(#wave)">
    <rect x="76" y="216" width="36" height="80" rx="18"/>
    <rect x="144" y="156" width="36" height="200" rx="18"/>
    <rect x="212" y="96" width="36" height="320" rx="18"/>
    <rect x="280" y="136" width="36" height="240" rx="18"/>
    <rect x="348" y="176" width="36" height="160" rx="18"/>
    <rect x="416" y="226" width="36" height="60" rx="18"/>
  </g>
</svg>
