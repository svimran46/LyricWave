<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <radialGradient id="catBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <radialGradient id="catWhite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </radialGradient>
    <linearGradient id="tabbyStripes" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.8" />
    </linearGradient>
    <filter id="furFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Shadow on floor -->
  <ellipse cx="150" cy="380" rx="90" ry="14" fill="#000000" opacity="0.25" />

  <g filter="url(#furFilter)">
    <!-- Tail curved around body -->
    <path d="M 180 340 C 230 350, 270 330, 260 270 C 255 240, 235 240, 238 255 C 242 280, 225 315, 175 325 Z" fill="#d97706" />
    <path d="M 245 265 C 240 275, 230 290, 215 305" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Body (Seated orange tabby) -->
    <ellipse cx="150" cy="275" rx="75" ry="95" fill="url(#catBody)" />

    <!-- Back tabby stripes -->
    <path d="M 95 240 Q 120 250 90 275" stroke="url(#tabbyStripes)" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 205 240 Q 180 250 210 275" stroke="url(#tabbyStripes)" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 90 290 Q 115 300 95 320" stroke="url(#tabbyStripes)" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 210 290 Q 185 300 205 320" stroke="url(#tabbyStripes)" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Chest patch (cream/white) -->
    <path d="M 130 205 Q 150 200 170 205 Q 185 270 150 310 Q 115 270 130 205 Z" fill="url(#catWhite)" />

    <!-- Paws -->
    <ellipse cx="125" cy="365" rx="22" ry="15" fill="url(#catWhite)" />
    <ellipse cx="175" cy="365" rx="22" ry="15" fill="url(#catWhite)" />
    <!-- Paw toe lines -->
    <path d="M 120 365 L 120 376 M 128 365 L 128 376" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 170 365 L 170 376 M 178 365 L 178 376" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />

    <!-- Head -->
    <circle cx="150" cy="150" r="62" fill="url(#catBody)" />

    <!-- Ears -->
    <!-- Left Ear -->
    <polygon points="98,130 90,60 135,100" fill="#d97706" />
    <polygon points="102,122 96,72 130,100" fill="#fbcfe8" />
    <!-- Right Ear -->
    <polygon points="202,130 210,60 165,100" fill="#d97706" />
    <polygon points="198,122 204,72 170,100" fill="#fbcfe8" />

    <!-- Forehead M-marking (Tabby) -->
    <path d="M 135 110 L 142 125 L 150 115 L 158 125 L 165 110" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 150 100 L 150 112" stroke="#78350f" stroke-width="4" stroke-linecap="round" />

    <!-- Eyes (Green/Amber with black pupils) -->
    <!-- Left eye -->
    <ellipse cx="128" cy="148" rx="12" ry="14" fill="#a3e635" />
    <ellipse cx="128" cy="148" rx="4.5" ry="11" fill="#18181b" />
    <circle cx="125" cy="143" r="3" fill="#ffffff" />
    <!-- Right eye -->
    <ellipse cx="172" cy="148" rx="12" ry="14" fill="#a3e635" />
    <ellipse cx="172" cy="148" rx="4.5" ry="11" fill="#18181b" />
    <circle cx="169" cy="143" r="3" fill="#ffffff" />

    <!-- Muzzle / cheeks -->
    <ellipse cx="140" cy="168" rx="14" ry="10" fill="url(#catWhite)" />
    <ellipse cx="160" cy="168" rx="14" ry="10" fill="url(#catWhite)" />

    <!-- Nose -->
    <polygon points="146,161 154,161 150,166" fill="#f43f5e" />

    <!-- Mouth -->
    <path d="M 150 166 L 150 171 Q 142 177 135 171 M 150 171 Q 158 177 165 171" stroke="#9f1239" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Whiskers -->
    <path d="M 125 168 Q 95 165 70 158" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 125 172 Q 95 174 72 173" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 125 176 Q 95 183 75 188" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 175 168 Q 205 165 230 158" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 175 172 Q 205 174 228 173" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 175 176 Q 205 183 225 188" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>
